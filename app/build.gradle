import java.util.Properties
import java.io.FileInputStream

plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // Note: Amazon Appstore prohibits 'amazon' in third-party package names
    namespace 'com.firecalc.tablet'
    compileSdk 34

    defaultConfig {
        applicationId "com.firecalc.tablet"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties.getProperty('storeFile', 'firecalc-release.jks'))
            storePassword keystoreProperties.getProperty('storePassword', 'FireCalc2026!')
            keyAlias keystoreProperties.getProperty('keyAlias', 'firecalc_key')
            keyPassword keystoreProperties.getProperty('keyPassword', 'FireCalc2026!')
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    // Android App Bundle (.aab) optimization for Amazon Appstore (bundletool 1.11+ compatible)
    bundle {
        language {
            enableSplit = true
        }
        density {
            // Enables density-specific APK generation for Fire 7 (mdpi/hdpi), HD 8 (tvdpi/hdpi), HD 10 & Max 11 (hdpi/xhdpi)
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Pure AOSP/AndroidX Libraries (100% compatible with Amazon Fire OS, zero GMS dependencies)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
